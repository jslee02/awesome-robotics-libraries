name: Suggest a Resource
description: Suggest a robotics library, simulator, tool, or curated list for the list
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Automation checks every suggestion against the [acceptance bar](https://github.com/jslee02/awesome-robotics-libraries/blob/main/CONTRIBUTING.md#acceptance-bar): for GitHub projects, at least 6 months old (or 1,000+ stars), 100+ stars, 3+ outside people who opened issues or PRs, a commit within 12 months, and a license. Please keep one open suggestion at a time.

  - type: input
    id: name
    attributes:
      label: Resource Name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: Project website, or the repository URL if there is no website
    validations:
      required: true

  - type: input
    id: github
    attributes:
      label: GitHub Repository
      description: "GitHub `owner/repo` (e.g., `google-deepmind/mujoco`). Leave blank if the project is not on GitHub; a maintainer will review it."
      placeholder: owner/repo

  - type: input
    id: alt_repo
    attributes:
      label: Alternative Repository
      description: GitLab, Bitbucket, or other source URL, if not on GitHub
      placeholder: https://gitlab.com/org/project

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "Pick by what the software mainly does, not by robot type. See the [category definitions](https://github.com/jslee02/awesome-robotics-libraries/blob/main/CONTRIBUTING.md#categories)."
      options:
        - Middleware & Frameworks
        - Robot Hardware & Drivers
        - Robot Description & Models
        - Kinematics & Dynamics
        - Physics Engines
        - Simulators
        - Motion Planning & Navigation
        - Control
        - Optimization
        - Math & Geometry
        - SLAM & State Estimation
        - Perception
        - Grasping & Manipulation
        - Robot Learning
        - Robot Data & Visualization
        - Other Awesome Lists
        - Not sure
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: Description
      description: "One neutral sentence, 100 characters or fewer, e.g. `Fast C++ library for rigid-body dynamics and their derivatives.`"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why should it be included?
      description: Optional. What gap does it fill, and who uses it?

  - type: dropdown
    id: affiliation
    attributes:
      label: Affiliation
      description: Suggesting your own project is welcome; we just ask you to say so.
      options:
        - I am an author or maintainer
        - I contribute to it
        - I use it
        - No affiliation
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Confirmation
      options:
        - label: I am a person, and I wrote or reviewed this suggestion myself.
          required: true
